<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Delete Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .form-container {
            width: 320px;
            margin: 80px auto;
            padding: 20px;
            background-color: white;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 7px;
            margin-top: 5px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c9302c;
            transform: translateY(-2px);
        }

        .back-btn {
           background: #6c757d;
           color: white;
           border: none;
           padding: 8px;
           border-radius: 4px;
           font-size: 15px;
           cursor: pointer;
           transition: all 0.3s ease;
           
        }

        .back-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Delete Product</h2>

        <form method="POST" action="/products/delete">

            <label>Enter Product ID</label>
            <input type="number" name="id" required>

            <button type="submit">Delete Product</button>
        </form>

        <br>
        <a href="/">
        <button class="back-btn">Back</button>
         </a>
    </div>

</body>

</html>
